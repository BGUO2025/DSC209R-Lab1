<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MLBB Radar Chart</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="../projects/project.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      margin: 20px;
    }

    .axis line { stroke: #aaa; stroke-width: 1px; }
    .grid { fill: none; stroke: #ddd; }
    .label { font-size: 12px; text-anchor: middle; }
    .area { fill-opacity: 0.25; stroke-width: 2px; }
    .dot { pointer-events: none; }

    .search-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    select {
      padding: 6px;
      font-size: 14px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h2>MLBB Hero Radar Chart</h2>
  <div class="search-container" id="hero-selectors"></div>
  <svg id="radar" width="640" height="480"></svg>
</body>
</html>
