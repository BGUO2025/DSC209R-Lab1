<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MLBB Radar Chart</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="../projects/project.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      margin: 20px;
    }

    body.dark-mode svg text {
      fill: white;
    }

    body.dark-mode .suggestions {
      color: black;
    }

    body.dark-mode #stats-panel {
      background-color: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #888;
    }

    body.dark-mode #stats-panel td {
      color: black;
    }

    .axis line { stroke: #aaa; stroke-width: 1px; }
    .grid { fill: none; stroke: #ddd; }
    .label { font-size: 12px; text-anchor: middle; }
    .area { fill-opacity: 0.25; stroke-width: 2px; }
    .dot { pointer-events: none; }

    .search-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
      width: 1400px;
    }

    .hero-input-wrapper .suggestions div:hover {
      background-color: #eee;
    }

    .chart-container {
      display:flex;
      align-items:flex-start;
      gap:0px;
      width: 1800px;
      height:800px;
    }

    select {
      padding: 10px 16px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #aaa;
      min-width: 200px;
    }

    #reset-btn {
      font-size: 18px;
      border-radius: 8px;
      background: #d33;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    #reset-btn:hover {
      background: #b22;
    }

  </style>
</head>

<body>
  <!-- Radar Chart Title -->
  <h2>MLBB Hero Radar Chart</h2>
  <!-- Dropdown Menus for Hero Selection & Reset Button-->
  <div class="search-container"></div>
  <!-- Radar Chart -->
  <div class="chart-container">
    <svg id="legend-container"></svg>
    <svg id="radar"></svg>
    <div id="stats-panel" style="font-family:monospace;"></div>
  </div>
</body>
</html>
